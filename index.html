<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>VTuber Starting Soon Loop</title>
  <style>
    :root {
      --w: 1920px;
      --h: 1080px;
      --loop: 10s;
      --ease: cubic-bezier(0.45, 0.05, 0.55, 0.95);
      --pink: #ffcfe6;
      --lavender: #d9d2ff;
      --mint: #ccefe8;
      --sky: #cfe6ff;
      --text-main: #ffffff;
      --text-sub: #fff6ff;
      --shadow: rgba(120, 90, 170, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    /* 1920x1080 固定キャンバス */
    .stage {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(120deg, var(--pink), var(--lavender), var(--mint), var(--sky));
      background-size: 250% 250%;
      animation: bgShift var(--loop) var(--ease) infinite;
    }

    /* 柔らかい光の層 */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      inset: -20%;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 0;
    }

    .stage::before {
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.30), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.18), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(255, 218, 241, 0.22), transparent 45%);
      animation: auraDrift var(--loop) ease-in-out infinite;
    }

    .stage::after {
      background:
        radial-gradient(circle at 10% 80%, rgba(211, 236, 255, 0.22), transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(255, 255, 255, 0.18), transparent 30%);
      animation: auraDrift2 var(--loop) ease-in-out infinite;
    }

    /* 背景のぼかし円（奥行き用） */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.42;
      z-index: 1;
      animation: blobFloat var(--loop) var(--ease) infinite;
    }

    .blob.b1 {
      width: 380px; height: 380px;
      left: -80px; top: 120px;
      background: radial-gradient(circle, rgba(255,255,255,0.65), rgba(255,255,255,0));
      animation-delay: -1.5s;
    }

    .blob.b2 {
      width: 520px; height: 520px;
      right: -140px; top: 80px;
      background: radial-gradient(circle, rgba(255,210,245,0.65), rgba(255,210,245,0));
      animation-delay: -5s;
    }

    .blob.b3 {
      width: 460px; height: 460px;
      right: 120px; bottom: -180px;
      background: radial-gradient(circle, rgba(205,240,255,0.62), rgba(205,240,255,0));
      animation-delay: -7s;
    }

    /* キャラクター */
    .character-wrap {
      position: absolute;
      left: 41%;
      bottom: 48px;
      width: 780px;
      height: 980px;
      transform: translateX(-50%);
      z-index: 3;
      animation: charEntrance var(--loop) var(--ease) infinite;
    }

    .character {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 16px 25px rgba(128, 93, 160, 0.22));
      transform-origin: 52% 70%;
      animation:
        charBob var(--loop) ease-in-out infinite,
        charBreath 4s ease-in-out infinite;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* テキストエリア */
    .title-block {
      position: absolute;
      right: 210px;
      top: 280px;
      z-index: 4;
      text-align: left;
      text-shadow:
        0 6px 18px var(--shadow),
        0 0 16px rgba(255, 255, 255, 0.25);
      animation: titleFloat var(--loop) ease-in-out infinite;
    }

    .starting {
      margin: 0;
      font-size: 108px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text-main);
      animation:
        fadeSequence var(--loop) ease-in-out infinite,
        pulseSoft 2.8s ease-in-out infinite;
    }

    .live {
      margin: 24px 0 0;
      font-size: 58px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-sub);
      opacity: 0.95;
      animation:
        fadeSequence var(--loop) ease-in-out infinite -0.25s,
        pulseSoft 3.2s ease-in-out infinite -0.2s;
    }

    /* パーティクル */
    .particles,
    .light-sweeps {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0));
      animation: particleMove var(--loop) linear infinite;
      opacity: 0;
    }

    .p1 { width: 14px; height: 14px; left: 8%; top: 82%; animation-delay: -0.8s; }
    .p2 { width: 10px; height: 10px; left: 18%; top: 70%; animation-delay: -2.1s; }
    .p3 { width: 16px; height: 16px; left: 28%; top: 92%; animation-delay: -3.5s; }
    .p4 { width: 12px; height: 12px; left: 41%; top: 84%; animation-delay: -5.2s; }
    .p5 { width: 9px;  height: 9px;  left: 54%; top: 88%; animation-delay: -1.3s; }
    .p6 { width: 15px; height: 15px; left: 66%; top: 94%; animation-delay: -4.4s; }
    .p7 { width: 11px; height: 11px; left: 74%; top: 76%; animation-delay: -6.1s; }
    .p8 { width: 13px; height: 13px; left: 86%; top: 86%; animation-delay: -7.2s; }

    /* 光の帯（6-10秒を強める） */
    .sweep {
      position: absolute;
      width: 420px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.95), rgba(255,255,255,0));
      filter: blur(1px);
      opacity: 0;
      transform: rotate(-12deg);
      animation: sweepFlow var(--loop) ease-in-out infinite;
    }

    .s1 { top: 180px; left: -460px; animation-delay: 0s; }
    .s2 { top: 460px; left: -500px; animation-delay: -1.7s; }
    .s3 { top: 760px; left: -520px; animation-delay: -3.6s; }

    /* 下部のうっすら床光 */
    .floor-glow {
      position: absolute;
      left: 50%;
      bottom: -120px;
      width: 1120px;
      height: 320px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.45), rgba(255,255,255,0));
      z-index: 2;
      animation: floorPulse var(--loop) ease-in-out infinite;
    }

    /* ===== Keyframes (10秒ループ) ===== */
    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes auraDrift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.75; }
      50% { transform: translate3d(1.5%, -1.5%, 0) scale(1.05); opacity: 1; }
    }

    @keyframes auraDrift2 {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.72; }
      50% { transform: translate3d(-1.3%, 1.1%, 0) scale(1.04); opacity: 0.95; }
    }

    @keyframes blobFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.06); }
    }

    @keyframes charEntrance {
      /* 0-2秒: ゆるやかに表示 */
      0%   { opacity: 0; transform: translateX(-50%) translateY(18px) scale(0.985); }
      20%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      /* 2-10秒: ほぼ維持してループ末尾で再接続 */
      90%  { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(18px) scale(0.985); }
    }

    @keyframes charBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(-0.35deg); }
      50% { transform: translateY(-3px) rotate(0.25deg); }
      75% { transform: translateY(-10px) rotate(-0.2deg); }
    }

    @keyframes charBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.01); }
    }

    @keyframes fadeSequence {
      /* 0-2秒 フェードイン */
      0% { opacity: 0; transform: translateY(14px) scale(0.96); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      /* 2-8秒 維持 */
      80% { opacity: 1; transform: translateY(0) scale(1); }
      /* 8-10秒 次ループ接続のため軽く戻す */
      100% { opacity: 0; transform: translateY(14px) scale(0.96); }
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes particleMove {
      0% {
        transform: translate3d(0, 30px, 0) scale(0.5);
        opacity: 0;
      }
      12% {
        opacity: 0.85;
      }
      55% {
        opacity: 0.55;
      }
      100% {
        transform: translate3d(220px, -290px, 0) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes sweepFlow {
      /* 6-10秒で可視化。終点を始点に合わせることでループ接続 */
      0%, 55% {
        transform: translateX(0) rotate(-12deg);
        opacity: 0;
      }
      62% {
        opacity: 0.6;
      }
      78% {
        opacity: 0.92;
      }
      100% {
        transform: translateX(2500px) rotate(-12deg);
        opacity: 0;
      }
    }

    @keyframes floorPulse {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) scaleX(0.95); }
      50% { opacity: 0.72; transform: translateX(-50%) scaleX(1.05); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="VTuber Starting Soon opening animation">
    <!-- 奥行きのある柔らかい発光背景 -->
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <!-- 演出用パーティクル -->
    <div class="particles" aria-hidden="true">
      <span class="particle p1"></span>
      <span class="particle p2"></span>
      <span class="particle p3"></span>
      <span class="particle p4"></span>
      <span class="particle p5"></span>
      <span class="particle p6"></span>
      <span class="particle p7"></span>
      <span class="particle p8"></span>
    </div>

    <!-- 6-10秒帯を印象づける光のスイープ -->
    <div class="light-sweeps" aria-hidden="true">
      <span class="sweep s1"></span>
      <span class="sweep s2"></span>
      <span class="sweep s3"></span>
    </div>

    <!-- キャラクター：主役として中央やや左に配置 -->
    <div class="character-wrap">
      <img class="character" src="pegmama.png" alt="ぺぐママ キャラクター" />
    </div>

    <!-- タイトルテキスト -->
    <section class="title-block" aria-label="stream title">
      <h1 class="starting">Starting Soon</h1>
      <p class="live">ぺぐママ LIVE</p>
    </section>

    <div class="floor-glow" aria-hidden="true"></div>
  </main>
</body>
</html>
